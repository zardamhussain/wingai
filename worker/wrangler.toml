name = "wingai-backend"
main = "src/index.ts"
compatibility_date = "2025-03-01"

[vars]
GEMINI_MODEL = "gemini-3.8-flash"
MAX_REQUEST_BYTES = "5242880"
RATE_LIMIT_PER_MINUTE = "30"
FREE_DAILY_LIMIT = "5"

[observability]
enabled = true

[placement]
mode = "smart"

[[durable_objects.bindings]]
name = "GEMINI_PROXY"
class_name = "GeminiRegionalProxy"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GeminiRegionalProxy"]

[[d1_databases]]
binding = "DB"
database_name = "wingai"
database_id = "86a67232-ce53-4f18-bddf-c128a43f4a1a"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "wingai-storage"

# Set GEMINI_API_KEY via secret in production:
# npx wrangler secret put GEMINI_API_KEY
# For local development, put GEMINI_API_KEY in worker/.dev.vars
